<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Smart Fitness Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

    <h1>Smart Fitness Dashboard</h1>


    <!-- ================================================= -->
    <!-- DASHBOARD -->
    <!-- ================================================= -->

    <section class="grid">

        <div class="card">
            Workout
            <strong id="workout">Pushups</strong>
        </div>

        <div class="card">
            CV Form
            <strong id="form">WAITING</strong>
        </div>

        <div class="card">
            EMG
            <strong id="emg">0%</strong>
        </div>

        <div class="card">
            Valid Reps
            <strong id="reps">0</strong>
        </div>

        <div class="card">
            Wearable
            <strong id="wearableStatus">DISCONNECTED</strong>
        </div>

    </section>


    <!-- ================================================= -->
    <!-- CAMERA -->
    <!-- ================================================= -->

    <section class="video-wrap">

        <video
            id="camera"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="overlay"></canvas>

        <div id="message">
            Connect wearable and start camera to begin.
        </div>

    </section>


    <!-- ================================================= -->
    <!-- CONTROLS -->
    <!-- ================================================= -->

    <div class="controls">

        <!-- WAVESHARE -->

        <button id="bleBtn">
            Connect Wearable
        </button>


        <!-- CAMERA -->

        <button id="cameraBtn">
            Start Camera
        </button>


        <!-- WORKOUT SELECTION -->

        <select id="workoutSelect">

            <!-- CHEST -->

            <option value="PUSHUPS">
                Pushups
            </option>

            <option value="CHEST FLY">
                Chest Fly
            </option>

            <option value="CHEST DIPS">
                Chest Dips
            </option>

            <option value="BENCH PRESS">
                Bench Press
            </option>


            <!-- SHOULDERS -->

            <option value="SHOULDER PRESS">
                Shoulder Press
            </option>

            <option value="LATERAL RAISES">
                Lateral Raises
            </option>

            <option value="FRONT RAISES">
                Front Raises
            </option>


            <!-- ARMS -->

            <option value="BICEP CURLS">
                Bicep Curls
            </option>

            <option value="TRICEP EXTENSIONS">
                Tricep Extensions
            </option>

            <option value="HAMMER CURLS">
                Hammer Curls
            </option>


            <!-- BACK -->

            <option value="DEADLIFT">
                Deadlift
            </option>

            <option value="LAT PULLDOWNS">
                Lat Pulldowns
            </option>

            <option value="PULL-UPS">
                Pull-ups
            </option>


            <!-- LEGS -->

            <option value="SQUATS">
                Squats
            </option>

            <option value="LEG EXTENSIONS">
                Leg Extensions
            </option>

            <option value="LEG PRESS">
                Leg Press
            </option>


            <!-- ABS -->

            <option value="CRUNCHES">
                Crunches
            </option>

            <option value="LEG RAISES">
                Leg Raises
            </option>

            <option value="RUSSIAN TWIST">
                Russian Twist
            </option>

        </select>

    </div>


    <!-- ================================================= -->
    <!-- WEARABLE INFORMATION -->
    <!-- ================================================= -->

    <section class="card">

        <div>
            Wearable:
            <strong id="wearableName">
                Not connected
            </strong>
        </div>

        <div>
            Sensor:
            <strong id="sensorStatus">
                DISCONNECTED
            </strong>
        </div>

        <div>
            EMG Raw:
            <strong id="emgRaw">
                0
            </strong>
        </div>

    </section>


    <!-- ================================================= -->
    <!-- REP RULE -->
    <!-- ================================================= -->

    <p class="rule">
        Rep = CV rep + correct form + EMG ≥ 65%.
    </p>

</main>


<!-- ===================================================== -->
<!-- MEDIAPIPE -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>


<!-- ===================================================== -->
<!-- EXERCISE TRACKER -->
<!-- ===================================================== -->

<script src="cv/exercise-tracker.js"></script>


<!-- ===================================================== -->
<!-- APPLICATION -->
<!-- ===================================================== -->

<script src="app.js"></script>


</body>

</html>
